<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Elya — Ton résultat</title>
  <meta name="theme-color" content="#FFF9F4">

  <link rel="icon" type="image/png" href="../assets/logo.png">
  <link rel="apple-touch-icon" href="../assets/logo.png">
  <link rel="stylesheet" href="../style/style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap"
    rel="stylesheet">
</head>

<body>

  <div class="decoration top"></div>
  <div class="decoration bottom"></div>

  <img src="../assets/butterfly.svg" class="decoration-sparkles" alt="" aria-hidden="true">

  <main class="card">

    <header class="brand">
      <img src="../assets/logo_lettre.png" alt="Elya" class="brand-logo">
    </header>

    <div class="eyebrow" id="eyebrow">Ton expérience Elya</div>

    <h1 id="titre">Votre résultat</h1>

    <p class="subtitle" id="subtitle">
      Et si on trouvait enfin le livre qui te correspond ?
    </p>

    <section class="podium-container">

      <div class="affinity-label">
        Ton taux d'affinité Elya
      </div>

      <div class="score" id="score">--</div>

      <div class="podium">

        <!-- Deuxième place -->
        <div class="podium-place">
          <div class="book left">
            <span class="book-title" id="b2-title">Ton<br>histoire</span>
            <span class="book-subtitle" id="b2-author">Elya</span>
          </div>

          <div class="podium-step left">
            <span>2</span>
          </div>
        </div>

        <!-- Première place -->
        <div class="podium-place">
          <div class="book center">
            <span class="book-title" id="b1-title">Ton<br>univers</span>
            <span class="book-subtitle" id="b1-author">Elya</span>
          </div>

          <div class="podium-step center">
            <span>1</span>
          </div>
        </div>

        <!-- Troisième place -->
        <div class="podium-place">
          <div class="book right">
            <span class="book-title" id="b3-title">Tes<br>envies</span>
            <span class="book-subtitle" id="b3-author">Elya</span>
          </div>

          <div class="podium-step right">
            <span>3</span>
          </div>
        </div>

      </div>

      <div class="podium-base"></div>

    </section>

    <div class="message" id="message">
      Découvre tous tes résultats directement dans l'application Elya.
    </div>

    <a id="store-btn" href="https://elya.app" class="btn">
      <span id="store-label">Découvrir Elya</span>
      <span class="btn-arrow">→</span>
    </a>

    <img src="../assets/leaf_branch_tall.svg" class="decoration-leaves" alt="" aria-hidden="true">

    <footer class="footer">
      Lis. Découvre. Partage. <span>✦</span>
    </footer>

  </main>

  <script>
    // Récupération des paramètres URL
    const params = new URLSearchParams(window.location.search);

    const titre = document.getElementById('titre');
    const score = document.getElementById('score');
    const message = document.getElementById('message');

    if (params.has('tag')) {
      document.getElementById('eyebrow').textContent = params.get('tag');
    }

    if (params.has('titre')) {
      titre.textContent = params.get('titre');
    }

    if (params.has('sub')) {
      document.getElementById('subtitle').textContent = params.get('sub');
    }

    if (params.has('score')) {
      let value = params.get('score');
      if (value && !value.includes('%')) {
        value += '%';
      }
      score.textContent = value;
    }

    if (params.has('msg')) {
      message.textContent = params.get('msg');
    }

    // Injection dynamique des 3 livres du podium
    if (params.has('b1')) document.getElementById('b1-title').textContent = params.get('b1');
    if (params.has('a1')) document.getElementById('b1-author').textContent = params.get('a1');

    if (params.has('b2')) document.getElementById('b2-title').textContent = params.get('b2');
    if (params.has('a2')) document.getElementById('b2-author').textContent = params.get('a2');

    if (params.has('b3')) document.getElementById('b3-title').textContent = params.get('b3');
    if (params.has('a3')) document.getElementById('b3-author').textContent = params.get('a3');

    // Détection automatique de l'OS
    const userAgent = navigator.userAgent || navigator.vendor || window.opera;
    const storeBtn = document.getElementById('store-btn');
    const storeLabel = document.getElementById('store-label');

    if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
      storeBtn.href = "https://apple.com";
      storeLabel.textContent = "Télécharger sur l'App Store";
    } else if (/android/i.test(userAgent)) {
      storeBtn.href = "https://google.com";
      storeLabel.textContent = "Télécharger sur Google Play";
    }
  </script>

</body>

</html>
