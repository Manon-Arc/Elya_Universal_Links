root /var/www/elya-links;

# 1. Fichier Apple (force le format JSON sans extension)
location = /.well-known/apple-app-site-association {
    default_type application/json;
    try_files $uri =404;
}

# 2. Fichier Android
location = /.well-known/assetlinks.json {
    default_type application/json;
    try_files $uri =404;
}

# 3. Dossier CSS (/style/)
location ^~ /style/ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, no-transform";
}

# 4. Dossier Images / Logos (/assets/)
location ^~ /assets/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, no-transform";
}

# 5. Page web de secours (/action)
location /action {
    index index.html;
    try_files $uri $uri/ /action/index.html;
}

# 6. Page d'accueil par défaut
location / {
    return 200 'Service de redirection actif';
    add_header Content-Type text/plain;
}