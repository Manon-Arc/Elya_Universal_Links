root /var/www/elya-links;

# Fichier Apple (force le format JSON obligatoire)
location = /.well-known/apple-app-site-association {
    default_type application/json;
    try_files $uri =404;
}

# Fichier Android
location = /.well-known/assetlinks.json {
    default_type application/json;
    try_files $uri =404;
}

location /action {
    index index.html;
    try_files $uri $uri/ /action/index.html;
}

location / {
    return 200 'Service de redirection actif';
    add_header Content-Type text/plain;
}
